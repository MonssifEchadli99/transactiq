name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle:
    name: Java 21 Gradle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build --console=plain

  container:
    name: Container / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - authorization-service
          - fraud-engine
          - case-management-service
          - case-search-service
          - investigation-assistant-service
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          load: true
          push: false
          tags: transactiq/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  terraform:
    name: Terraform formatting and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.4"
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize without a backend
        working-directory: infra/environments/dev
        run: terraform init -backend=false -input=false
      - name: Validate
        working-directory: infra/environments/dev
        run: terraform validate
