name: Deploy dev

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Bootstrap shared foundation, or deploy services after secret versions exist
        type: choice
        required: true
        default: foundation
        options:
          - foundation
          - services
      operation:
        description: Create a plan, or request an environment-approved apply
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-transactiq-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
  GCP_TERRAFORM_STATE_BUCKET: ${{ vars.GCP_TERRAFORM_STATE_BUCKET }}
  TRANSACTIQ_KAFKA_BOOTSTRAP_SERVERS: ${{ vars.TRANSACTIQ_KAFKA_BOOTSTRAP_SERVERS }}
  TRANSACTIQ_OPENSEARCH_URL: ${{ vars.TRANSACTIQ_OPENSEARCH_URL }}

jobs:
  prepare:
    name: Validate deployment inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require deliberate deployment configuration
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Dev deployment is restricted to the main branch" >&2
            exit 1
          fi
          required=(GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REGISTRY_REPOSITORY GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT GCP_TERRAFORM_STATE_BUCKET)
          if [[ "${{ inputs.scope }}" == "services" ]]; then
            required+=(TRANSACTIQ_KAFKA_BOOTSTRAP_SERVERS TRANSACTIQ_OPENSEARCH_URL)
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Required repository/environment variable is not configured: ${name}" >&2
              exit 1
            fi
          done
      - uses: docker/setup-buildx-action@v3
        if: inputs.scope == 'services'
      - name: Build images tagged with the commit SHA without publishing
        if: inputs.scope == 'services'
        shell: bash
        run: |
          services=(authorization-service fraud-engine case-management-service case-search-service investigation-assistant-service)
          for service in "${services[@]}"; do
            docker buildx build \
              --build-arg "SERVICE=${service}" \
              --tag "transactiq/${service}:${GITHUB_SHA}" \
              --cache-from "type=gha,scope=${service}" \
              --cache-to "type=gha,mode=max,scope=${service}" \
              --load .
          done

  plan:
    name: Terraform plan
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.4"
      - name: Initialize configured remote state
        working-directory: infra/environments/dev
        run: >-
          terraform init -input=false
          -backend-config="bucket=${GCP_TERRAFORM_STATE_BUCKET}"
          -backend-config="prefix=transactiq/dev"
      - name: Keep foundation bootstrap from removing deployed services
        if: inputs.scope == 'foundation'
        working-directory: infra/environments/dev
        shell: bash
        run: |
          if terraform state list | grep -q '^module\.'; then
            echo "Foundation scope is bootstrap-only after Cloud Run services have entered this state; use services scope for subsequent plans." >&2
            exit 1
          fi
      - name: Plan
        working-directory: infra/environments/dev
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.GCP_REGION }}
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_artifact_registry_repository_id: ${{ env.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
          TF_VAR_external_kafka_bootstrap_servers: ${{ env.TRANSACTIQ_KAFKA_BOOTSTRAP_SERVERS }}
          TF_VAR_external_opensearch_url: ${{ env.TRANSACTIQ_OPENSEARCH_URL }}
          TF_VAR_deploy_services: ${{ inputs.scope == 'services' && 'true' || 'false' }}
        run: terraform plan -input=false -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: transactiq-dev-${{ inputs.scope }}-${{ github.sha }}-tfplan
          path: |
            infra/environments/dev/tfplan
            infra/environments/dev/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  apply:
    name: Apply approved Terraform plan
    if: inputs.operation == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    environment: transactiq-dev
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: inputs.scope == 'services'
      - name: Authorize Artifact Registry
        if: inputs.scope == 'services'
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
        if: inputs.scope == 'services'
      - name: Publish immutable images after environment approval
        if: inputs.scope == 'services'
        shell: bash
        run: |
          services=(authorization-service fraud-engine case-management-service case-search-service investigation-assistant-service)
          registry="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPOSITORY}"
          for service in "${services[@]}"; do
            image="${registry}/${service}:${GITHUB_SHA}"
            if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
              echo "Immutable image already exists; retaining ${image}"
              continue
            fi
            docker buildx build \
              --build-arg "SERVICE=${service}" \
              --tag "${image}" \
              --cache-from "type=gha,scope=${service}" \
              --cache-to "type=gha,mode=max,scope=${service}" \
              --push .
          done
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.4"
      - uses: actions/download-artifact@v5
        with:
          name: transactiq-dev-${{ inputs.scope }}-${{ github.sha }}-tfplan
          path: infra/environments/dev
      - name: Initialize configured remote state
        working-directory: infra/environments/dev
        run: >-
          terraform init -input=false
          -backend-config="bucket=${GCP_TERRAFORM_STATE_BUCKET}"
          -backend-config="prefix=transactiq/dev"
      - name: Apply the reviewed plan
        working-directory: infra/environments/dev
        run: terraform apply -input=false tfplan
