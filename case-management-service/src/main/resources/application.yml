spring:
  application:
    name: case-management-service
  datasource:
    url: "${CASE_MANAGEMENT_DB_URL:jdbc:postgresql://localhost:${TRANSACTIQ_CASE_POSTGRES_PORT:5434}/transactiq_case_management}"
    username: "${CASE_MANAGEMENT_DB_USERNAME:transactiq_case_local}"
    password: "${CASE_MANAGEMENT_DB_PASSWORD:transactiq_case_local}"
  liquibase:
    change-log: "classpath:db/changelog/db.changelog-master.xml"
  kafka:
    bootstrap-servers: "${TRANSACTIQ_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: manual_immediate
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true

fraud-case:
  projection:
    topic: "transactiq.fraud-case.projection.v1"
    topic-partitions: 1
    batch-size: 50
    poll-interval: 1s
    lease-duration: 30s
    retry-initial-backoff: 1s
    retry-maximum-backoff: 30s
    bootstrap-enabled: false
    bootstrap-batch-size: 100
    environment: "${TRANSACTIQ_ENVIRONMENT:local}"
    producer-operation-timeout: 10s
  consumer:
    topic: "transactiq.authorization.completed.v1"
    group-id: "transactiq-case-management-v1"
    retry-initial-interval: 1s
    retry-maximum-interval: 30s
    unexpected-total-attempts: 5
    recovery-retry-interval: 1s
    dlt-topic: "transactiq.authorization.completed.v1.dlt"
    topic-partitions: 1

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
  metrics:
    tags:
      application: "${spring.application.name}"

logging:
  structured:
    format:
      console: "${TRANSACTIQ_LOG_FORMAT:logstash}"
