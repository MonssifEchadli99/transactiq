services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: transactiq_authorization
      POSTGRES_USER: transactiq_local
      POSTGRES_PASSWORD: transactiq_local
    ports:
      - "127.0.0.1:${TRANSACTIQ_POSTGRES_PORT:-5433}:5432"
    volumes:
      - transactiq_authorization_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U transactiq_local -d transactiq_authorization
      interval: 5s
      timeout: 5s
      retries: 10

  case-postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: transactiq_case_management
      POSTGRES_USER: transactiq_case_local
      POSTGRES_PASSWORD: transactiq_case_local
    ports:
      - "127.0.0.1:${TRANSACTIQ_CASE_POSTGRES_PORT:-5434}:5432"
    volumes:
      - transactiq_case_management_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U transactiq_case_local -d transactiq_case_management
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.9-alpine3.21
    ports:
      - "127.0.0.1:${TRANSACTIQ_REDIS_PORT:-6380}:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "127.0.0.1:${TRANSACTIQ_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${TRANSACTIQ_KAFKA_PORT:-9092},PLAINTEXT://kafka:19092
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transactiq_authorization_postgres_data:
  transactiq_case_management_postgres_data:
