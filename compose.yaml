services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: transactiq_authorization
      POSTGRES_USER: transactiq_local
      POSTGRES_PASSWORD: transactiq_local
    ports:
      - "127.0.0.1:${TRANSACTIQ_POSTGRES_PORT:-5433}:5432"
    volumes:
      - transactiq_authorization_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U transactiq_local -d transactiq_authorization
      interval: 5s
      timeout: 5s
      retries: 10

  case-postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: transactiq_case_management
      POSTGRES_USER: transactiq_case_local
      POSTGRES_PASSWORD: transactiq_case_local
    ports:
      - "127.0.0.1:${TRANSACTIQ_CASE_POSTGRES_PORT:-5434}:5432"
    volumes:
      - transactiq_case_management_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U transactiq_case_local -d transactiq_case_management
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.9-alpine3.21
    ports:
      - "127.0.0.1:${TRANSACTIQ_REDIS_PORT:-6380}:6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "127.0.0.1:${TRANSACTIQ_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:${TRANSACTIQ_KAFKA_PORT:-9092},PLAINTEXT://kafka:19092
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.2.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      DISABLE_SECURITY_PLUGIN: "true" # Local development only; not production security.
    ports:
      - "127.0.0.1:${TRANSACTIQ_OPENSEARCH_PORT:-9200}:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - transactiq_fraud_case_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  fraud-engine:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: fraud-engine
    environment:
      FRAUD_ENGINE_GRPC_PORT: 9090
      FRAUD_ENGINE_MANAGEMENT_PORT: 8081
      SPRING_DATA_REDIS_HOST: redis
      TRANSACTIQ_REDIS_PORT: 6379
    ports:
      - "127.0.0.1:${TRANSACTIQ_FRAUD_MANAGEMENT_PORT:-8081}:8081"
      - "127.0.0.1:${TRANSACTIQ_FRAUD_GRPC_PORT:-9090}:9090"
    depends_on:
      redis:
        condition: service_healthy

  authorization-service:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: authorization-service
    environment:
      AUTHORIZATION_DB_URL: jdbc:postgresql://postgres:5432/transactiq_authorization
      AUTHORIZATION_DB_USERNAME: transactiq_local
      AUTHORIZATION_DB_PASSWORD: transactiq_local
      TRANSACTIQ_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TRANSACTIQ_FRAUD_GRPC_HOST: fraud-engine
      TRANSACTIQ_FRAUD_GRPC_PORT: 9090
      TRANSACTIQ_FRAUD_GRPC_PLAINTEXT: "true"
    ports:
      - "127.0.0.1:${TRANSACTIQ_AUTHORIZATION_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fraud-engine:
        condition: service_started

  case-management-service:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: case-management-service
    environment:
      CASE_MANAGEMENT_DB_URL: jdbc:postgresql://case-postgres:5432/transactiq_case_management
      CASE_MANAGEMENT_DB_USERNAME: transactiq_case_local
      CASE_MANAGEMENT_DB_PASSWORD: transactiq_case_local
      TRANSACTIQ_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "127.0.0.1:${TRANSACTIQ_CASE_MANAGEMENT_PORT:-8083}:8080"
    depends_on:
      case-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  case-search-service:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: case-search-service
    environment:
      TRANSACTIQ_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TRANSACTIQ_OPENSEARCH_URL: http://opensearch:9200
    ports:
      - "127.0.0.1:${TRANSACTIQ_CASE_SEARCH_PORT:-8084}:8080"
    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  investigation-assistant-service:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: investigation-assistant-service
    environment:
      SPRING_PROFILES_ACTIVE: demo-offline
      TRANSACTIQ_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TRANSACTIQ_OPENSEARCH_URL: http://opensearch:9200
    ports:
      - "127.0.0.1:${TRANSACTIQ_INVESTIGATION_PORT:-8085}:8080"
    depends_on:
      kafka:
        condition: service_healthy
      opensearch:
        condition: service_healthy

volumes:
  transactiq_authorization_postgres_data:
  transactiq_case_management_postgres_data:
  transactiq_fraud_case_opensearch_data:
